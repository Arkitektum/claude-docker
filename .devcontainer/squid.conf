# Squid forward proxy for Claude Code container
# Domain-based allowlist, no caching

http_port 127.0.0.1:3128

# Disable caching
cache deny all

# Access logging
access_log stdio:/var/log/squid/access.log
cache_store_log none

# Only allow standard web ports
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Domain allowlist
acl allowed_domains dstdomain .anthropic.com
acl allowed_domains dstdomain .statsig.com
acl allowed_domains dstdomain .sentry.io
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain .pypi.org
acl allowed_domains dstdomain .pythonhosted.org
acl allowed_domains dstdomain .astral.sh
acl allowed_domains dstdomain .crates.io
acl allowed_domains dstdomain .rust-lang.org
acl allowed_domains dstdomain .rustup.rs
acl allowed_domains dstdomain .golang.org
acl allowed_domains dstdomain storage.googleapis.com
acl allowed_domains dstdomain .nuget.org
acl allowed_domains dstdomain .visualstudio.com
acl allowed_domains dstdomain vscode.blob.core.windows.net
acl allowed_domains dstdomain mcp.exa.ai
acl allowed_domains dstdomain mcp.context7.com
acl allowed_domains dstdomain instances-mcp.vantage.sh
acl allowed_domains dstdomain .claude.ai
acl allowed_domains dstdomain platform.claude.com
acl allowed_domains dstdomain .atlassian.com

http_access allow allowed_domains
http_access deny all

# Don't leak proxy info
via off
forwarded_for delete
httpd_suppress_version_string on

# Runtime
cache_effective_user proxy
cache_effective_group proxy
coredump_dir /var/spool/squid
shutdown_lifetime 1 seconds
visible_hostname localhost
